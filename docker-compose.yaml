services:
  postgres:
    image: postgres
    container_name: het-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: het-root-user
      POSTGRES_DB: home_energy_tracker
    ports:
      - "5433:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
      - db-data:/var/log/postgresql

volumes:
  db-data: